<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Population Counter — Embeddable Widget</title>
<meta name="robots" content="noindex, follow">
<style>
  :root {
    --bg: #0a0a12; --surface: #12121e; --border: #1e1e30;
    --text: #F5F5FA; --muted: #8C8CA1; --blue: #38BDF8;
    --green: #34D399; --red: #FB7185;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 2px;
  }
  .wrap {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px 14px;
  }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
  }
  .label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted);
  }
  .live { display: flex; align-items: center; gap: 5px; font-size: 10.5px;
    font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--green); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    animation: p 1.5s ease-in-out infinite; }
  @keyframes p { 0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.5)} 50%{box-shadow:0 0 0 5px rgba(52,211,153,0)} }
  .count {
    font-size: clamp(26px, 7vw, 40px); font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .cell {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 11px;
  }
  .cell .k { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .cell .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .credit {
    display: block; margin-top: 11px; font-size: 11px; color: var(--muted);
    text-decoration: none; text-align: right;
  }
  .credit b { color: var(--blue); font-weight: 600; }
  .credit:hover b { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="label">World Population</span>
    <span class="live"><span class="dot"></span>Live</span>
  </div>
  <div class="count" id="pop">—</div>
  <div class="row">
    <div class="cell"><div class="k">Births today</div><div class="v up" id="b">—</div></div>
    <div class="cell"><div class="k">Deaths today</div><div class="v down" id="d">—</div></div>
  </div>
  <a class="credit" href="https://worldpulse.fyi/" target="_blank" rel="noopener">
    Live data by <b>World Pulse</b>
  </a>
</div>

<script>
// Same projection model as the main site: a fixed baseline advanced forward
// using annual World Bank / UN rates. No network calls, so the widget cannot
// slow down or break the page that embeds it.
(function () {
  var EPOCH = Date.UTC(2025, 0, 1);
  var YEAR  = 365.25 * 24 * 3600 * 1000;
  var BASE  = 8215424893;          // world population at EPOCH
  var BIRTH = 16.333620 / 1000;    // per person per year
  var DEATH = 7.589052 / 1000;
  var nf = new Intl.NumberFormat('en-US');

  function tick() {
    var now = Date.now();
    var yrs = (now - EPOCH) / YEAR;
    document.getElementById('pop').textContent =
      nf.format(Math.floor(BASE + BASE * (BIRTH - DEATH) * yrs));

    var d = new Date(now);
    var frac = (now - Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())) / 86400000;
    document.getElementById('b').textContent =
      '+' + nf.format(Math.floor(BASE * BIRTH / 365.25 * frac));
    document.getElementById('d').textContent =
      '−' + nf.format(Math.floor(BASE * DEATH / 365.25 * frac));
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
